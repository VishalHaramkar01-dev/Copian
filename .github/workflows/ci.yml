name: Copian B2B Full-Stack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          cd copian/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and FastAPI integration tests
        run: |
          cd copian/backend
          python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: copian/frontend/package-lock.json
      - name: Install, Typecheck, Lint, and Build Frontend
        run: |
          cd copian/frontend
          npm ci
          npx tsc --noEmit
          npm run build
